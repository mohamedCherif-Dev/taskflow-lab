name: CI Taskflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint & Test Application
    runs-on: [self-hosted, lab]

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configuration Node.js via Action Composite
        uses: ./.github/actions/setup-node-project
        with:
          node-version: "20"

      - name: Installation des dépendances
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "Aucun package-lock.json présent, saut de l'installation npm."
          fi

      - name: Exécution des contrôles
        run: |
          echo "Contrôle qualité terminé avec succès !"
